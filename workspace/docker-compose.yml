services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: xennic-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
      - ./scripts:/workspace/scripts:ro
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - xennic-network
    healthcheck:
      test: ["CMD-SHELL", "sh /workspace/scripts/qdrant-healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  xennic-network:
    external: true

volumes:
  qdrant_storage:
    driver: local
