name: Release Gate

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip unit/e2e tests'
        required: false
        default: false
        type: boolean
      run_e2e:
        description: 'Run E2E tests (manual-only until stabilization)'
        required: false
        default: false
        type: boolean

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  architecture-validation:
    name: Architecture Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Architecture
        run: npx tsx tools/architecture/validate.ts --no-reports
        timeout-minutes: 5

  typecheck:
    name: Typecheck
    needs: [architecture-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Typecheck
        run: pnpm typecheck
        timeout-minutes: 10

  lint:
    name: Lint
    needs: [architecture-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint API
        run: pnpm --filter @xennic/api lint
        timeout-minutes: 5

  tests:
    name: Tests
    needs: [architecture-validation]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xennic
          POSTGRES_PASSWORD: xennic
          POSTGRES_DB: xennic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://xennic:xennic@localhost:5432/xennic_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma Client
        run: pnpm db:generate
      - name: Push Schema
        run: npx prisma db push --skip-generate
      - name: Build Database Package
        run: pnpm --filter @xennic/database build
        timeout-minutes: 2
      - name: Generate CI JWT keys
        run: |
          mkdir -p /tmp/xennic-jwt
          openssl genrsa -out /tmp/xennic-jwt/jwtRS256.key 2048
          openssl rsa -in /tmp/xennic-jwt/jwtRS256.key -pubout -out /tmp/xennic-jwt/jwtRS256.key.pub
          echo "JWT_PRIVATE_KEY_PATH=/tmp/xennic-jwt/jwtRS256.key" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PATH=/tmp/xennic-jwt/jwtRS256.key.pub" >> "$GITHUB_ENV"
          echo "JWT_ISSUER=xennic-platform" >> "$GITHUB_ENV"
          echo "JWT_AUDIENCE=xennic-client" >> "$GITHUB_ENV"
          echo "JWT_ACCESS_TOKEN_TTL=900" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_TOKEN_TTL=2592000" >> "$GITHUB_ENV"
      - name: Unit Tests
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip_tests }}
        run: |
          set -o pipefail
          pnpm --dir apps/api exec jest --runInBand 2>&1 | tee /tmp/xennic-release-unit-tests.log
        timeout-minutes: 15
      - name: E2E Tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_e2e && !inputs.skip_tests }}
        run: pnpm --dir apps/api exec jest --config test/jest-e2e.json --runInBand
        timeout-minutes: 15
      - name: E2E Tests Skipped
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.run_e2e }}
        run: echo "E2E tests are manual-only until dedicated E2E stabilization is complete."
      - name: Upload Release Gate unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-unit-test-log
          path: /tmp/xennic-release-unit-tests.log
          if-no-files-found: ignore
          retention-days: 7

  documentation-validation:
    name: Documentation Validation
    needs: [architecture-validation, typecheck, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify OpenAPI Spec
        run: test -f packages/openapi/v1/openapi.json && echo "OpenAPI exists"
      - name: Verify ADR References
        run: ls docs/adr/ADR-*.md > /dev/null 2>&1 && echo "ADRs present" || exit 1
      - name: Verify Bootstrap Version
        run: grep -q "Bootstrap Version" docs/PROJECT_BOOTSTRAP.md
      - name: Verify STATUS_REPORT
        run: grep -q "✅" docs/STATUS_REPORT.md
      - name: Verify AGENTS.md
        run: grep -q "validate:arch" AGENTS.md
      - name: Verify Mermaid Diagrams
        run: grep -rl "mermaid" docs/ --include="*.mmd" 2>/dev/null || echo "No mermaid files found"
      - name: Verify Build Certification
        run: test -f docs/generated/build-certification.md && echo "Certification exists" || echo "No certification yet"

  release-validator:
    name: Release Validator
    if: github.ref == 'refs/heads/main'
    needs: [architecture-validation, typecheck, lint, tests, documentation-validation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate CI JWT keys
        run: |
          mkdir -p /tmp/xennic-jwt
          openssl genrsa -out /tmp/xennic-jwt/jwtRS256.key 2048
          openssl rsa -in /tmp/xennic-jwt/jwtRS256.key -pubout -out /tmp/xennic-jwt/jwtRS256.key.pub
          echo "JWT_PRIVATE_KEY_PATH=/tmp/xennic-jwt/jwtRS256.key" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_PATH=/tmp/xennic-jwt/jwtRS256.key.pub" >> "$GITHUB_ENV"
          echo "JWT_ISSUER=xennic-platform" >> "$GITHUB_ENV"
          echo "JWT_AUDIENCE=xennic-client" >> "$GITHUB_ENV"
          echo "JWT_ACCESS_TOKEN_TTL=900" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_TOKEN_TTL=2592000" >> "$GITHUB_ENV"
      - name: Run Release Validator
        run: pnpm validate:release
        timeout-minutes: 10
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: release-reports
          path: docs/generated/
          retention-days: 90

  build-certification:
    name: Build Certification
    if: github.ref == 'refs/heads/main'
    needs: [release-validator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: release-reports
          path: docs/generated/
      - name: Verify Certification
        run: |
          echo "Build certification grade:"
          grep -E '^\| Grade \|' docs/generated/build-certification.md || true
          if grep -Eq '^\| Grade \|[[:space:]]*Fail[[:space:]]*\|' docs/generated/build-certification.md || grep -Fq '❌ **FAILED**' docs/generated/build-certification.md; then
            echo "❌ Build certification FAILED"
            exit 1
          fi
          echo "✅ Build certification PASSED"

  release-artifacts:
    name: Release Artifacts
    if: github.ref == 'refs/heads/main'
    needs: [build-certification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: docs/generated/release-manifest.json
          retention-days: 365
      - name: Summary
        run: |
          echo "## Release Gate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture Validation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Typecheck | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Documentation Validation | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Validator | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Certification | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ **Release Ready** | |" >> $GITHUB_STEP_SUMMARY
