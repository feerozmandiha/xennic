name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: xennic
          POSTGRES_PASSWORD: xennic
          POSTGRES_DB: xennic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://xennic:xennic@localhost:5432/xennic_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Validate Prisma Schema
        run: pnpm prisma:validate

      - name: Push Schema
        run: npx prisma db push --skip-generate

      - name: Validate Architecture
        run: pnpm validate:arch

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint API
        run: pnpm --filter @xennic/api lint

      - name: Lint Web
        run: pnpm --filter @xennic/web lint

      - name: Test API
        run: pnpm --dir apps/api exec jest --runInBand
        timeout-minutes: 15

      - name: Build
        run: pnpm build
        timeout-minutes: 10

  engineering-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/services/engineering-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workspace/services/engineering-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: pytest tests -q --tb=short

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/services/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workspace/services/ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: pytest tests -q --tb=short
