name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test API
        run: pnpm --filter @xennic/api test

      - name: Build
        run: pnpm build

  engineering-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/services/engineering-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workspace/services/engineering-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: pytest tests -q --tb=short

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace/services/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: workspace/services/ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: pytest tests -q --tb=short
