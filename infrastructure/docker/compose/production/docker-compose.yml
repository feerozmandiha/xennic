# ══════════════════════════════════════════════════════════════════════════════
# Xennic Platform — Phase-0 Alpha Production Stack (single server)
#
# Usage (see docs/deployment/phase-0-alpha-launch.md):
#   1. cp infrastructure/docker/compose/production/.env.production.example \
#         infrastructure/docker/compose/production/.env
#   2. Fill in all CHANGE_ME values.
#   3. ./infrastructure/docker/scripts/deploy.sh
#
# All application services live on a private network. Only the nginx reverse
# proxy is exposed to the host (NGINX_HTTP_PORT / NGINX_HTTPS_PORT). Infra
# services publish NO host ports, so this stack can coexist with a local
# development stack on the same machine. To expose them for debugging, add the
# override file:
#   docker compose -f docker-compose.yml -f docker-compose.debug-ports.yml up -d
# ══════════════════════════════════════════════════════════════════════════════

name: xennic-prod

services:
  # ── Data & broker infrastructure ────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: xennic-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xennic}
      POSTGRES_USER: ${POSTGRES_USER:-xennic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xennic}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-xennic} -d ${POSTGRES_DB:-xennic}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [xennic]
    logging: &logging
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  redis:
    image: redis:8-alpine
    container_name: xennic-prod-redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-xennic}', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-xennic}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [xennic]
    logging: *logging

  rabbitmq:
    image: rabbitmq:4-management
    container_name: xennic-prod-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-xennic}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-xennic}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [xennic]
    logging: *logging

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: xennic-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    networks: [xennic]
    logging: *logging

  qdrant:
    image: qdrant/qdrant:latest
    container_name: xennic-prod-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - ../../../../workspace/scripts/qdrant-healthcheck.sh:/healthcheck.sh:ro
    healthcheck:
      test: ['CMD', 'sh', '/healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [xennic]
    logging: *logging

  # ── Python domain services ──────────────────────────────────────────────────
  engineering-service:
    build:
      context: ../../../../workspace/services/engineering-service
      dockerfile: Dockerfile
    container_name: xennic-prod-engineering-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    networks: [xennic]
    logging: *logging

  ai-service:
    build:
      context: ../../../../workspace/services/ai-service
      dockerfile: Dockerfile
    container_name: xennic-prod-ai-service
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ENGINEERING_SERVICE_URL: http://engineering-service:8001
      QDRANT_URL: http://qdrant:6333
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    depends_on:
      engineering-service:
        condition: service_healthy
    networks: [xennic]
    logging: *logging

  vision-service:
    build:
      context: ../../../../workspace/services/vision-service
      dockerfile: Dockerfile
    container_name: xennic-prod-vision-service
    restart: unless-stopped
    environment:
      SERVICE_PORT: 8003
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      OCR_ENGINE_MODE: ${VISION_OCR_ENGINE_MODE:-hybrid}
      VISION_LLM_PROVIDER: ${VISION_LLM_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
    deploy:
      resources:
        limits:
          memory: 2G
    networks: [xennic]
    logging: *logging

  # ── Backend API (NestJS) ────────────────────────────────────────────────────
  api:
    build:
      context: ../../../..
      dockerfile: apps/api/Dockerfile
    container_name: xennic-prod-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Direct PostgreSQL connection for phase-0 alpha (PgBouncer is optional later)
      DATABASE_URL: postgresql://${POSTGRES_USER:-xennic}:${POSTGRES_PASSWORD:-xennic}@postgres:5432/${POSTGRES_DB:-xennic}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-xennic}@redis:6379/${REDIS_DB:-0}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-xennic}:${RABBITMQ_DEFAULT_PASS:-xennic}@rabbitmq:5672
      # JWT (RSA keys mounted from ./secrets/jwt)
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      JWT_ISSUER: ${JWT_ISSUER:-xennic-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-xennic-client}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-900}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-2592000}
      # Object storage
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: 'false'
      # Internal service URLs
      ENGINEERING_SERVICE_URL: http://engineering-service:8001
      AI_SERVICE_URL: http://ai-service:8002
      VISION_SERVICE_URL: http://vision-service:8003
      # Web / CORS
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      # Email
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@xennic.ir}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Xennic}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      # Billing
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
      TAX_RATE: ${TAX_RATE:-0.09}
      BILLING_TEST_MODE: ${BILLING_TEST_MODE:-true}
      # AI provider credential encryption
      AI_MASTER_KEY: ${AI_MASTER_KEY:-}
      # Seed admin credentials (used by `docker compose run --rm api node prisma/seed.js`)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@xennic.ir}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ./secrets/jwt/jwtRS256.key:/run/secrets/jwt_private_key:ro
      - ./secrets/jwt/jwtRS256.key.pub:/run/secrets/jwt_public_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/api/v1/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [xennic]
    logging: *logging

  # ── Frontend Web (Next.js) ──────────────────────────────────────────────────
  web:
    build:
      context: ../../../..
      dockerfile: apps/web/Dockerfile
      args:
        # Single-origin behind nginx: browser calls same-origin /api/* and
        # /api/v1/vision/* which nginx routes to api and vision-service.
        NEXT_PUBLIC_API_URL: ${FRONTEND_URL:-http://localhost:3001}
        NEXT_PUBLIC_VISION_API_URL: ${FRONTEND_URL:-http://localhost:3001}
    container_name: xennic-prod-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3001/']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [xennic]
    logging: *logging

  # ── Reverse proxy / TLS termination ─────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: xennic-prod-nginx
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/ssl:ro
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_started
    networks: [xennic]
    logging: *logging

networks:
  xennic:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  qdrant_data:
