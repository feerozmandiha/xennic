worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    server_tokens   off;
    client_max_body_size 100m;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream web_backend    { server web:3001; }
    upstream api_backend    { server api:3000; }
    upstream vision_backend { server vision-service:8003; }

    # ── HTTP (Phase-0 Alpha default) ──────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Vision (OCR / image analysis) served by the Python vision-service
        location /api/v1/vision/ {
            proxy_pass http://vision_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
            client_max_body_size 100m;
        }

        # NestJS API (global prefix /api/v1) + Swagger (/api/docs)
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;   # SSE / streaming (AI chat)
            client_max_body_size 100m;
        }

        # Next.js web application
        location / {
            proxy_pass http://web_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }

    # ── HTTPS — enable after provisioning certificates (see deployment runbook)
    #
    #   1. Place fullchain.pem and privkey.pem in ./certs/ (compose mounts it at
    #      /etc/nginx/ssl/).
    #   2. Uncomment the block below, set `server_name`, and expose port 443 in
    #      docker-compose.yml (already exposed by default).
    #
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /api/v1/vision/ { proxy_pass http://vision_backend; ... }
    #     location /api/          { proxy_pass http://api_backend;    ... }
    #     location /              { proxy_pass http://web_backend;    ... }
    # }
}
