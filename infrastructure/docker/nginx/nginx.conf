worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    server_tokens   off;
    client_max_body_size 100m;
    keepalive_timeout 65s;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Rate limiting / connection limiting ──────────────────────────────────
    limit_req_zone  $binary_remote_addr zone=api_per_ip:10m    rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=vision_per_ip:10m rate=2r/s;
    limit_req_zone  $binary_remote_addr zone=web_per_ip:10m    rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── WebSocket / streaming support ─────────────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Upstreams ─────────────────────────────────────────────────────────────
    upstream web_backend {
        server web:3001;
        keepalive 32;
    }

    upstream api_backend {
        server api:3000;
        keepalive 32;
    }

    upstream vision_backend {
        server vision-service:8003;
        keepalive 16;
    }

    # ── Shared reverse-proxy settings ─────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host                $host;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host    $host;
    proxy_set_header X-Forwarded-Proto   $scheme;
    proxy_set_header X-Forwarded-Port    $server_port;
    proxy_set_header Upgrade             $http_upgrade;
    proxy_set_header Connection          $connection_upgrade;

    # ── HTTP → HTTPS ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # ── HTTPS / TLS termination ───────────────────────────────────────────────
    # Certificates are mounted by production docker-compose from:
    #   infrastructure/docker/compose/production/certs
    # Required files inside the container:
    #   /etc/nginx/ssl/fullchain.pem
    #   /etc/nginx/ssl/privkey.pem
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_tickets off;

        # Security headers. CSP intentionally keeps inline/eval allowances for
        # the current Next.js build; tighten further once nonce-based CSP is in.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        limit_conn conn_per_ip 50;

        # Vision (OCR / image analysis) served by the Python vision-service.
        # Heavy OCR endpoints get a stricter per-IP budget than the main API.
        location /api/v1/vision/ {
            limit_req zone=vision_per_ip burst=10 nodelay;
            proxy_pass http://vision_backend;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
            client_max_body_size 100m;
        }

        # NestJS API (global prefix /api/v1) + Swagger (/api/docs).
        location /api/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://api_backend;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;   # SSE / streaming (AI chat)
            client_max_body_size 100m;
        }

        # Next.js web application.
        location / {
            limit_req zone=web_per_ip burst=100 nodelay;
            proxy_pass http://web_backend;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
}
