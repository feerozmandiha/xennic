route:
  receiver: default
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: critical
      match:
        severity: critical
      repeat_interval: 1h
    - receiver: warning
      match:
        severity: warning
      repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: "http://webhook:3000/api/v1/webhooks/alertmanager"
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: "http://webhook:3000/api/v1/webhooks/alertmanager"
        send_resolved: true

  - name: warning
    webhook_configs:
      - url: "http://webhook:3000/api/v1/webhooks/alertmanager"
        send_resolved: true

templates:
  - "/etc/alertmanager/templates/*.tmpl"

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
