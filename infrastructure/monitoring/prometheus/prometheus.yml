global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - "alerts/*.yml"

scrape_configs:
  - job_name: "xennic-api"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets:
          - api:3000
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: "xennic_.*"
        action: keep

  - job_name: "xennic-engineering"
    metrics_path: /metrics
    static_configs:
      - targets:
          - engineering-service:8001

  - job_name: "xennic-ai"
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-service:8002

  - job_name: "xennic-vision"
    metrics_path: /metrics
    static_configs:
      - targets:
          - vision-service:8003

  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: "postgres"
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: "redis"
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: "rabbitmq"
    static_configs:
      - targets:
          - rabbitmq-exporter:9419

  - job_name: "xennic-validation"
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9465
